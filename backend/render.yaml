services:
  - type: web
    name: youpi-mern-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: YOUPI_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
